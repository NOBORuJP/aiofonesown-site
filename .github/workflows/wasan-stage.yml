name: Stage WASAN 83 public release

on:
  push:
    branches:
      - feature/wasan-83-public-20260920
    paths:
      - .github/workflows/wasan-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify rollback ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor df97f3e3166c53ad7a7db11f8338f7f77ad9298f HEAD

      - name: Restore exact audited public text payload
        run: |
          set -euo pipefail
          cat .wasan-stage/WASAN-PUBLISH-TEXT-PAYLOAD-0.b64 \
              .wasan-stage/WASAN-PUBLISH-TEXT-PAYLOAD-1.b64 \
            | base64 -d > /tmp/wasan-public-text.tgz
          echo "31bed801625764d723538d2fb6cd320b9efbf680a88183abe76e76879a40697e  /tmp/wasan-public-text.tgz" | sha256sum -c -
          test -f wasan/downloads/research-reproduction.zip
          test -f wasan/downloads/research-reproduction-en.zip
          find wasan -type f ! -name '*.zip' -delete
          rm -f \
            wasan/downloads/AI-NOBORu-wasan-site.zip \
            wasan/downloads/AI-NOBORu-wasan-site-en.zip \
            wasan/downloads/AI-NOBORu-aiofonesown-kit.zip
          tar -xzf /tmp/wasan-public-text.tgz -C wasan

      - name: Rebuild public distribution packages
        run: |
          set -euo pipefail
          python .wasan-stage/wasan_stage_build.py

      - name: Publication sanity checks
        run: |
          set -euo pipefail
          test "$(find wasan -type f | wc -l | tr -d ' ')" = "103"
          test "$(find wasan -name '*.mjs' -type f | wc -l | tr -d ' ')" = "58"
          while IFS= read -r f; do node --check "$f" >/dev/null; done < <(find wasan -name '*.mjs' -type f | sort)
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re
          root=Path('wasan')
          man=json.loads((root/'SHA256SUMS.json').read_text('utf-8'))
          files=[p for p in root.rglob('*') if p.is_file()]
          if len(files)!=103 or len(man)!=102:
              raise SystemExit(f'count mismatch files={len(files)} manifest={len(man)}')
          for rel,want in man.items():
              p=root/rel
              if not p.is_file(): raise SystemExit('missing '+rel)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=want: raise SystemExit('hash mismatch '+rel)
          strong=re.compile(r'R48|GPT-?5|GPT56|Claude|Gemini|TRUE FINAL|PREZIP|PRIVATE REVIEW|FINAL AUDIT|第三者レビュー|監査報告',re.I)
          hits=[]
          for p in files:
              if p.suffix.lower() in {'.html','.mjs','.js','.css','.txt','.json','.md','.svg'}:
                  try: s=p.read_text('utf-8')
                  except Exception: continue
                  if strong.search(s): hits.append(str(p.relative_to(root)))
          if hits: raise SystemExit('internal jargon remains: '+repr(hits))
          html=list(root.rglob('*.html'))
          if len(html)!=21: raise SystemExit(f'expected 21 html, got {len(html)}')
          for p in html:
              s=p.read_text('utf-8')
              if 'name="robots"' not in s or 'index,follow' not in s:
                  raise SystemExit('robots not public: '+str(p))
          print('PUBLICATION_SANITY_PASS files=103 manifest=102 mjs=58 html=21')
          PY

      - name: Commit staged public site
        run: |
          set -euo pipefail
          rm -rf .wasan-stage
          rm -f .github/workflows/wasan-stage.yml
          git config user.name "AI NOBORU Release"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish WASAN 83 bilingual site"
          git push origin HEAD:feature/wasan-83-public-20260920
