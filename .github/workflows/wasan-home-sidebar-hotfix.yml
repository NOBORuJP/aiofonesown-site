name: WASAN home and English reading hotfix

on:
  push:
    branches:
      - feature/wasan-home-sidebar-fix-20260921
    paths:
      - .github/workflows/wasan-home-sidebar-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wasan-home-sidebar-fix-20260921
          fetch-depth: 0

      - name: Verify base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 745ecf592c0a97677ec8e40ad885989fa75411c4 HEAD

      - name: Apply WASAN home/sidebar fix and rebuild packages
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, json, html, hashlib, io

          root = Path("wasan")
          en = root / "en"

          items = [
            ("tsurukame","Cranes and Turtles","Separate two populations from heads and legs"),
            ("kafusoku","Surplus and Deficit","Infer a group size from two distributions"),
            ("nezumi","Mouse Problems and Geometric Growth","Follow repeated multiplication"),
            ("abura","The Oil-Jug Problem","Measure a quantity using only containers"),
            ("kaiho","Digit-by-Digit Square Root","Build a square root one digit at a time"),
            ("kairitsu","Digit-by-Digit Cube Root","Build a cube root one digit at a time"),
            ("koko","Kōkojutsu: Right Triangles","Find a side of a right triangle"),
            ("pythagorean","Integer Right-Triangle Triples","Make a right triangle with integer sides"),
            ("sansha","Area from Three Sides","Find area without knowing the altitude"),
            ("hyakugo","Hyakugo Remainder Method","Reconstruct a number from its remainders"),
            ("josephus","Mamako-date and Elimination Circles","Count around a ring to find the survivors"),
            ("magic","Magic Squares","Make rows, columns, and diagonals agree"),
            ("daseki","Keida-seki: Stacked Sums","Sum an entire stack at once"),
            ("polygonal","Polygonal Numbers","Unify triangular, pentagonal and hexagonal numbers"),
          ]
          nav_items = "".join(
            f'<a class="nav-item" href="./#{html.escape(i)}"><span aria-hidden="true" class="nav-num">{n:02d}</span><span><span class="nav-label">{html.escape(name)}</span><span class="nav-sub">{html.escape(sub)}</span></span></a>'
            for n,(i,name,sub) in enumerate(items,1)
          )
          chapter_links = "".join([
            '<a href="./#tsurukame"><span class="chapter-range">01–14</span><span class="chapter-label">Foundations</span></a>',
            '<a href="./#combinatorics"><span class="chapter-range">15–28</span><span class="chapter-label">Patterns, Counting &amp; Integers</span></a>',
            '<a href="./#tengen"><span class="chapter-range">29–42</span><span class="chapter-label">Equations &amp; Algebra</span></a>',
            '<a href="./#survey"><span class="chapter-range">43–56</span><span class="chapter-label">Measurement, Circles &amp; Tables</span></a>',
            '<a href="./#sangaku"><span class="chapter-range">57–70</span><span class="chapter-label">Solids &amp; Tangency</span></a>',
            '<a href="./#bernoulli"><span class="chapter-range">71–83</span><span class="chapter-label">Deeper Explorations</span></a>',
          ])
          sidebar = (
            '<aside class="sidebar"><p class="eyebrow">Choose a tool <span>01—83</span></p>'
            '<nav aria-label="Calculator chapters" id="navigation-pages">'+chapter_links+'</nav>'
            '<nav aria-label="Calculation tools" data-total="83" id="navigation">'+nav_items+'</nav>'
            '<div class="sidebar-note"><span class="tiny-rule"></span><p>Move from the answer to the idea.</p>'
            '<span>Every tool includes step-by-step calculations, conditions, and sources.</span></div></aside>'
          )
          purpose = (
            '<nav aria-label="Choose a starting point" class="purpose-nav">'
            '<a href="./about-first.html"><strong>Play with numbers</strong><span>Start with circles and sums</span></a>'
            '<a href="./#sangaku"><strong>Test a shape</strong><span>Explore a gap between circles</span></a>'
            '<a href="./about-research.html"><strong>Read the research</strong><span>Explore questions earlier mathematicians left open.</span></a>'
            '</nav>'
          )

          # English static reading pages: same public shell as Japanese.
          for p in sorted(en.glob("about*.html")):
              s = p.read_text("utf-8")
              if '../navigation.css' not in s:
                  s = s.replace('<link href="../mobile.css" rel="stylesheet"/>',
                                '<link href="../mobile.css" rel="stylesheet"/><link href="../navigation.css" rel="stylesheet"/>')
              if '../mobile-nav.mjs' not in s:
                  s = s.replace('</head>', '<script src="../mobile-nav.mjs" type="module"></script></head>', 1)
              s = s.replace('class="brand" href="./#tsurukame"', 'class="brand" href="./about.html"')
              if 'class="purpose-nav"' not in s:
                  pos = s.find('</header>')
                  if pos < 0: raise SystemExit(f"header missing: {p}")
                  pos += len('</header>')
                  s = s[:pos] + purpose + s[pos:]
              if '<div class="layout"><aside class="sidebar">' not in s:
                  s, n = re.subn(
                      r'<main class="reading" id="workspace"(?: tabindex="-1")?>',
                      '<div class="layout">'+sidebar+'<main id="workspace" tabindex="-1">',
                      s, count=1)
                  if n != 1: raise SystemExit(f"main opening missing: {p}")
                  s, n = re.subn(
                      r'(<nav[^>]*class="reading-index"[^>]*>.*?</nav>)',
                      r'\1<article class="reading">', s, count=1, flags=re.S)
                  if n != 1: raise SystemExit(f"reading index missing: {p}")
                  idx = s.rfind('</main>')
                  if idx < 0: raise SystemExit(f"main close missing: {p}")
                  s = s[:idx] + '</article></main></div>' + s[idx+len('</main>'):]
              p.write_text(s, "utf-8")

          # No-hash WASAN entry opens the introduction; calculator hashes remain unchanged.
          for rel in ["index.html", "en/index.html"]:
              p = root / rel
              s = p.read_text("utf-8")
              if 'data-wasan-home-redirect' not in s:
                  s = s.replace('</head>',
                    '<script data-wasan-home-redirect>if(!location.hash)location.replace("./about.html");</script></head>', 1)
              s = s.replace('class="brand" href="#tsurukame"', 'class="brand" href="./about.html"')
              if rel == "index.html":
                  s = s.replace('href="#history" id="reading-link"', 'href="./about.html" id="reading-link"')
              p.write_text(s, "utf-8")

          # Japanese reading pages: logo/home now points to the introduction.
          for p in sorted(root.glob("about*.html")):
              s = p.read_text("utf-8").replace('class="brand" href="./#tsurukame"', 'class="brand" href="./about.html"')
              p.write_text(s, "utf-8")

          # Preserve top-level kit helper files before replacing the kit.
          dist = root / "downloads"
          kit_path = dist / "AI-NOBORu-aiofonesown-kit.zip"
          with ZipFile(kit_path) as z:
              kit_helpers = {
                  n: z.read(n)
                  for n in z.namelist()
                  if not n.startswith("wasan/") and n != "SHA256SUMS.json"
              }

          dist_names = {
              "downloads/AI-NOBORu-wasan-site.zip",
              "downloads/AI-NOBORu-wasan-site-en.zip",
              "downloads/AI-NOBORu-aiofonesown-kit.zip",
          }

          def digest(data): return hashlib.sha256(data).hexdigest()
          def json_bytes(obj):
              return (json.dumps(obj, ensure_ascii=False, indent=2, sort_keys=True) + "\n").encode("utf-8")
          def all_files():
              return sorted(p for p in root.rglob("*") if p.is_file())

          # Site-package manifest excludes the three distribution archives and itself.
          site_manifest = {}
          for p in all_files():
              rel = p.relative_to(root).as_posix()
              if rel == "SHA256SUMS.json" or rel in dist_names: continue
              site_manifest[rel] = digest(p.read_bytes())
          site_manifest_bytes = json_bytes(site_manifest)

          def build_site_zip(out_path, prefix):
              with ZipFile(out_path, "w", ZIP_DEFLATED, compresslevel=9) as z:
                  for p in all_files():
                      rel = p.relative_to(root).as_posix()
                      if rel in dist_names: continue
                      if rel == "SHA256SUMS.json":
                          z.writestr(prefix + rel, site_manifest_bytes)
                      else:
                          z.write(p, prefix + rel)

          jp_zip = dist / "AI-NOBORu-wasan-site.zip"
          en_zip = dist / "AI-NOBORu-wasan-site-en.zip"
          build_site_zip(jp_zip, "AI-NOBORu-wasan/")
          build_site_zip(en_zip, "AI-NOBORu-wasan-en/")

          # Kit's internal wasan manifest excludes the kit itself and manifest itself.
          kit_wasan_manifest = {}
          for p in all_files():
              rel = p.relative_to(root).as_posix()
              if rel == "SHA256SUMS.json" or rel == "downloads/AI-NOBORu-aiofonesown-kit.zip": continue
              kit_wasan_manifest[rel] = digest(p.read_bytes())
          kit_wasan_manifest_bytes = json_bytes(kit_wasan_manifest)

          # Assemble kit entries first so the top manifest can hash exact bytes.
          kit_entries = dict(kit_helpers)
          for p in all_files():
              rel = p.relative_to(root).as_posix()
              if rel == "downloads/AI-NOBORu-aiofonesown-kit.zip": continue
              arc = "wasan/" + rel
              if rel == "SHA256SUMS.json":
                  kit_entries[arc] = kit_wasan_manifest_bytes
              else:
                  kit_entries[arc] = p.read_bytes()
          kit_top_manifest = {k: digest(v) for k,v in sorted(kit_entries.items())}
          kit_top_manifest_bytes = json_bytes(kit_top_manifest)
          with ZipFile(kit_path, "w", ZIP_DEFLATED, compresslevel=9) as z:
              for name,data in sorted(kit_entries.items()):
                  z.writestr(name, data)
              z.writestr("SHA256SUMS.json", kit_top_manifest_bytes)

          # Root manifest is generated last and tracks every file except itself.
          root_manifest = {}
          for p in all_files():
              rel = p.relative_to(root).as_posix()
              if rel == "SHA256SUMS.json": continue
              root_manifest[rel] = digest(p.read_bytes())
          (root / "SHA256SUMS.json").write_bytes(json_bytes(root_manifest))

          # Structural acceptance for this hotfix (stdlib only).
          for p in sorted(en.glob("about*.html")):
              check = p.read_text("utf-8")
              if check.count('class="sidebar"') != 1: raise SystemExit(f"sidebar missing {p}")
              if check.count('class="purpose-nav"') != 1: raise SystemExit(f"purpose nav missing {p}")
              if check.count('class="nav-item"') != 14: raise SystemExit(f"nav item count {p}")
              if check.count('class="chapter-range"') != 6: raise SystemExit(f"chapter count {p}")
          for rel in ["index.html","en/index.html"]:
              s=(root/rel).read_text("utf-8")
              if "data-wasan-home-redirect" not in s: raise SystemExit("home redirect missing "+rel)

          # Package acceptance.
          if len(list(root.rglob("*.html"))) != 21: raise SystemExit("HTML count changed")
          if len(list(root.rglob("*.mjs"))) != 58: raise SystemExit("MJS count changed")
          with ZipFile(jp_zip) as z:
              if len(z.namelist()) != 100: raise SystemExit("JP package count")
          with ZipFile(en_zip) as z:
              if len(z.namelist()) != 100: raise SystemExit("EN package count")
          with ZipFile(kit_path) as z:
              if len(z.namelist()) != 109: raise SystemExit("kit package count")
          if len(root_manifest) != 102: raise SystemExit(f"root manifest count {len(root_manifest)}")
          print("WASAN_HOME_SIDEBAR_HOTFIX_PASS")
          PY

      - name: Check JavaScript and changed scope
        run: |
          set -euo pipefail
          while IFS= read -r f; do node --check "$f" >/dev/null; done < <(find wasan -name '*.mjs' -type f | sort)
          git diff --name-only 745ecf592c0a97677ec8e40ad885989fa75411c4...HEAD || true

      - name: Commit hotfix
        run: |
          set -euo pipefail
          rm -f .github/workflows/wasan-home-sidebar-hotfix.yml
          git config user.name "AI NOBORU Release"
          git config user.email "noreply@users.noreply.github.com"
          git add -A wasan .github/workflows/wasan-home-sidebar-hotfix.yml
          git status --short
          git commit -m "fix: make Wasan introduction the home and keep English reading sidebar"
          git push origin HEAD:feature/wasan-home-sidebar-fix-20260921
