<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1191" viewBox="0 0 1500 1191" role="img" aria-labelledby="title desc"><title id="title">先人の算法から、AI NOBORU の検証へ</title><desc id="desc">「数学が成り立つ」ことと「誰がいつ考えたか」を分けて記録します。 得られた証明・実装・反例と、まだ確認できていない史実を、ともに次へ渡します。</desc><rect width="1500" height="1135" fill="#f5f3eb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="66" font-size="40" fill="#193b48" font-weight="600">先人の算法から、AI NOBORU の検証へ</text><text x="48" y="113" font-size="22" fill="#193b48" font-weight="400">「数学が成り立つ」ことと「誰がいつ考えたか」を分けて記録します。</text><rect x="48" y="168" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="212" font-size="28" fill="#946640" font-weight="600">1　史料と先行研究</text><text x="78" y="258" font-size="25" fill="#193b48" font-weight="400">関の交式・斜乗をめぐる研究、松永の構成、菅野の先行する改良。</text><text x="78" y="297" font-size="25" fill="#193b48" font-weight="400">参照：後藤・小松（2004）、竹之内（2010）。原写本全ての校合は未完。</text><rect x="48" y="353" width="1404" height="202" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="397" font-size="28" fill="#946640" font-weight="600">2　二つの現代的な構成</text><text x="78" y="443" font-size="25" fill="#193b48" font-weight="400">A：循環＋反転。代表の符号と、反転による周期4の符号を付ける。</text><text x="78" y="482" font-size="25" fill="#193b48" font-weight="400">B：先頭固定の偶置換＋末尾交換。反転の符号式を混ぜない。</text><text x="78" y="521" font-size="25" fill="#193b48" font-weight="400">いずれも n ≥ 3。一般証明と、3〜9次の各409,110項の検証。</text><rect x="48" y="577" width="1404" height="202" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="621" font-size="28" fill="#946640" font-weight="600">3　四次・五次・六次から先へ</text><text x="78" y="667" font-size="25" fill="#193b48" font-weight="400">代表数：4次は3、5次は12、6次は60。各代表から2n項を生成。</text><text x="78" y="706" font-size="25" fill="#193b48" font-weight="400">全項数：24、120、720。7次5,040項、8次40,320項、9次362,880項。</text><text x="78" y="745" font-size="25" fill="#193b48" font-weight="400">行列の大きさであり、一般五次方程式の根号解法を意味しない。</text><rect x="48" y="801" width="1404" height="202" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="845" font-size="28" fill="#946640" font-weight="600">4　消去計算と相消対</text><text x="78" y="891" font-size="25" fill="#193b48" font-weight="400">終結式の例：5次437、6次1,279、7次3,773。規約の符号も照合。</text><text x="78" y="930" font-size="25" fill="#193b48" font-weight="400">相消対：(n−1)n! / 2。4次36、5次240、6次1,800。</text><text x="78" y="969" font-size="25" fill="#193b48" font-weight="400">史料の全番号・配列との一対一照合や、世界初という優先権は未確定。</text><text x="48" y="1057" font-size="20" fill="#193b48" font-weight="400">得られた証明・実装・反例と、まだ確認できていない史実を、ともに次へ渡します。</text><text x="48" y="1098" font-size="20" fill="#193b48" font-weight="400">AI NOBORU  |  2026年9月15日 更新  |  出典・異説は本文に併記</text></g><g data-ainoboru-attribution="true"><rect x="0" y="1135" width="1500" height="56" fill="#183744"/><a href="https://www.aiofonesown.com/"><text x="750.0" y="1171" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24">AI NOBORU · www.aiofonesown.com</text></a></g></svg>