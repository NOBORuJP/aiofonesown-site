<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1269" viewBox="0 0 1500 1269" role="img" aria-labelledby="title desc"><title id="title">和算家たち ― 学びの関係を分けて読む</title><desc id="desc">矢印は下記の出典が述べる師弟関係。分野が同じことだけで線をつなぎません。 網羅的な師弟系図・免許の宗統図ではありません。年代表記と読みの資料差は本文参照。</desc><rect width="1500" height="1213" fill="#f5f3eb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="66" font-size="40" fill="#193b48" font-weight="600">和算家たち ― 学びの関係を分けて読む</text><text x="48" y="113" font-size="22" fill="#193b48" font-weight="400">矢印は下記の出典が述べる師弟関係。分野が同じことだけで線をつなぎません。</text><rect x="48" y="168" width="1404" height="202" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="212" font-size="28" fill="#946640" font-weight="600">関流の一部を抜粋</text><text x="78" y="258" font-size="25" fill="#193b48" font-weight="400">荒木村英 → 松永良弼 → 山路主住 → 安島直円</text><text x="78" y="297" font-size="25" fill="#193b48" font-weight="400">松永：生年未詳–1744（1690年頃説）／ 安島：1732–1798（資料差あり）</text><text x="78" y="336" font-size="25" fill="#193b48" font-weight="400">出典：松永良弼・山路主住の辞典項目、国立国会図書館典拠</text><rect x="48" y="392" width="1404" height="202" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="436" font-size="28" fill="#946640" font-weight="600">山路には、複数の学び先があった</text><text x="78" y="482" font-size="25" fill="#193b48" font-weight="400">中根元圭 → 山路主住　／　久留島義太 → 山路主住</text><text x="78" y="521" font-size="25" fill="#193b48" font-weight="400">山路主住 → 藤田貞資（1734–1807）</text><text x="78" y="560" font-size="25" fill="#193b48" font-weight="400">久留島：くるしま よしひろ。宝暦7年没／西暦1758表記。出典：辞典項目</text><rect x="48" y="616" width="1404" height="241" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="660" font-size="28" fill="#946640" font-weight="600">石黒信由（1760–1836）の三つの学び</text><text x="78" y="706" font-size="25" fill="#193b48" font-weight="400">中田高寛 → 石黒信由【算学】</text><text x="78" y="745" font-size="25" fill="#193b48" font-weight="400">宮井安泰 → 石黒信由【測量】</text><text x="78" y="784" font-size="25" fill="#193b48" font-weight="400">西村太冲 → 石黒信由【天文・暦学】</text><text x="78" y="823" font-size="25" fill="#193b48" font-weight="400">出典：文化庁「石黒信由関係資料」詳細解説</text><rect x="48" y="879" width="1404" height="202" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="923" font-size="28" fill="#946640" font-weight="600">研究分野と伝承は、別の枠で読む</text><text x="78" y="969" font-size="25" fill="#193b48" font-weight="400">田中由真（1651–1719）：消去・行列式・魔方陣。石黒の直接の師ではない。</text><text x="78" y="1008" font-size="25" fill="#193b48" font-weight="400">山路之徽：主住の子、天文方・数学。出典：東京大学「比例尺解義」。</text><text x="78" y="1047" font-size="25" fill="#193b48" font-weight="400">高原吉種に関が学んだという関係は伝承。確定した師弟線として描かない。</text><text x="48" y="1135" font-size="20" fill="#193b48" font-weight="400">網羅的な師弟系図・免許の宗統図ではありません。年代表記と読みの資料差は本文参照。</text><text x="48" y="1176" font-size="20" fill="#193b48" font-weight="400">AI NOBORU  |  2026年9月15日 更新  |  出典・異説は本文に併記</text></g><g data-ainoboru-attribution="true"><rect x="0" y="1213" width="1500" height="56" fill="#183744"/><a href="https://www.aiofonesown.com/"><text x="750.0" y="1249" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24">AI NOBORU · www.aiofonesown.com</text></a></g></svg>