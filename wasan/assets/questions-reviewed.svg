<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1444" viewBox="0 0 1500 1444" role="img" aria-labelledby="title desc"><title id="title">12の課題 ― 次に何を確かめるか</title><desc id="desc">この研究で取り組む12の課題。数式・史料・応用の確認範囲を分けています。 本文の12項目表で、各課題の扱いを説明しています。歴史上の師弟関係の図ではありません。</desc><rect width="1500" height="1388" fill="#f5f3eb"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"><text x="48" y="66" font-size="40" fill="#193b48" font-weight="600">12の課題 ― 次に何を確かめるか</text><text x="48" y="113" font-size="22" fill="#193b48" font-weight="400">この研究で取り組む12の課題。数式・史料・応用の確認範囲を分けています。</text><rect x="48" y="168" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="212" font-size="28" fill="#946640" font-weight="600">01 記法・翻訳 ／ 02 消去・行列式</text><text x="78" y="258" font-size="25" fill="#193b48" font-weight="400">史料の記号を版・頁とともに照合する。</text><text x="78" y="297" font-size="25" fill="#193b48" font-weight="400">A・Bの構成は証明・有限検証。原文の意図と訂正は別に調べる。</text><rect x="48" y="353" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="397" font-size="28" fill="#946640" font-weight="600">03 定乗 ／ 04 円周率・円理</text><text x="78" y="443" font-size="25" fill="#193b48" font-weight="400">語義と生成手順を個別に確認。「失伝」と一括しない。</text><text x="78" y="482" font-size="25" fill="#193b48" font-weight="400">近似算法と、先人が実際に外挿した量を区別する。</text><rect x="48" y="538" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="582" font-size="28" fill="#946640" font-weight="600">05 求積 ／ 06 高次方程式</text><text x="78" y="628" font-size="25" fill="#193b48" font-weight="400">求積の成立条件を比較。無出典の人名鎖は掲載しない。</text><text x="78" y="667" font-size="25" fill="#193b48" font-weight="400">数値近似・消去・根号解法を分ける。高次全般の解決とは称さない。</text><rect x="48" y="723" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="767" font-size="28" fill="#946640" font-weight="600">07 六球連鎖 ／ 08 測量・暦学</text><text x="78" y="813" font-size="25" fill="#193b48" font-weight="400">1822年奉納・1832年記録・1936年Soddy発表。半径と位置の閉合を区別。</text><text x="78" y="852" font-size="25" fill="#193b48" font-weight="400">石黒の算学・測量・暦学の師を区別。連名だけで師弟とは決めない。</text><rect x="48" y="908" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="952" font-size="28" fill="#946640" font-weight="600">09 原資料 ／ 10 異本・校訂</text><text x="78" y="998" font-size="25" fill="#193b48" font-weight="400">所在・画像・読了範囲を残す。未収集を不存在にしない。</text><text x="78" y="1037" font-size="25" fill="#193b48" font-weight="400">転記、欠番、配列変更、反転代表の違いを分ける。</text><rect x="48" y="1093" width="1404" height="163" rx="14" fill="#fff" stroke="#cbd6d0"/><text x="78" y="1137" font-size="28" fill="#946640" font-weight="600">11 成果の帰属 ／ 12 現代応用</text><text x="78" y="1183" font-size="25" fill="#193b48" font-weight="400">史料・先行研究・現代再構成・未確認の4つを区別する。</text><text x="78" y="1222" font-size="25" fill="#193b48" font-weight="400">数学モデルと実機・実測を区別。掲載した装置応用は実機未検証。</text><text x="48" y="1310" font-size="20" fill="#193b48" font-weight="400">本文の12項目表で、各課題の扱いを説明しています。歴史上の師弟関係の図ではありません。</text><text x="48" y="1351" font-size="20" fill="#193b48" font-weight="400">AI NOBORU  |  2026年9月15日 更新  |  出典・異説は本文に併記</text></g><g data-ainoboru-attribution="true"><rect x="0" y="1388" width="1500" height="56" fill="#183744"/><a href="https://www.aiofonesown.com/"><text x="750.0" y="1424" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24">AI NOBORU · www.aiofonesown.com</text></a></g></svg>